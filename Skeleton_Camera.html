<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Camera Viewer</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7fc;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;margin:auto;padding:16px}h2{margin:4px 0 12px;font-size:22px}small{font-size:12px;color:#abc}.view{position:relative;background:#05080d;border:1px solid #4a5870;border-radius:14px;overflow:hidden;height:min(57vh,520px);min-height:260px}.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#05080d;pointer-events:none}.view #preview{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05080d}.view video{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;opacity:1!important;object-fit:contain!important;pointer-events:none!important;z-index:0}.view #preview{z-index:1;opacity:0;touch-action:none;user-select:none;-webkit-user-select:none}.zoomBadge{position:absolute;right:12px;top:12px;z-index:3;background:#0b1428bb;border:1px solid #64748b;border-radius:16px;padding:5px 10px;font-size:13px;font-weight:700;pointer-events:none}.hint{z-index:2}.hint{position:absolute;inset:0;display:grid;place-items:center;color:#b7c3d8;pointer-events:none}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{flex:1;min-width:120px;border:0;border-radius:10px;padding:13px;background:#367df0;color:white;font-weight:700;font-size:15px}button:disabled{opacity:.4}.secondary{background:#33445e}.box{background:#1b2b42;border:1px solid #3b4d67;border-radius:12px;padding:14px;margin-top:12px}.box strong{display:block;font-size:12px;color:#a9c4ec;margin-bottom:8px}.caption{font-size:18px;min-height:58px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls label{font-size:13px;color:#c6d5e9}.controls select{backgroun </style></head><body><main><h2>AI Camera Viewer <small>v1.19</small></h2><div class="view"><video id="video" autoplay muted playsinline webkit-playsinline disablepictureinpicture></video><canvas id="preview"></canvas><canvas id="objects"></canvas><div id="zoomBadge" class="zoomBadge">1.0×</div><div id="hint" class="hint">Tap Start Camera</div></div><div class="buttons"><button id="start">Start Camera</button><button id="switch" class="secondary" disabled>Switch Camera</button><button id="flash" class="secondary" disabled>⚡ Flash Off</button></div><div class="controls"><label>Recognition speed <select id="speed"><option value="3500">Battery saver</option><option value="2000" selected>Balanced</option><option value="1000">Fast</option></select></label><label><input type="checkbox" id="labels" checked> Show object labels</label><button id="analyze" class="secondary">Analyze</button><button id="readText" class="secondary" style="min-width:120px;flex:0">Read Text</button></div><div class="box"><strong>WHAT THE CAMERA SEES</strong><div class="caption" id="caption">Waiting for camera…</div></div><div id="status">Ready.</div><div class="buttons"><button id="photo" class="secondary">Take Photo Instead</button><input id="file" type="file" accept="image/*" capture="environment" hidden></div><canvas id="sample" width="224" height="224"></canvas></main><script>
(()=>{'use strict';const v=document.querySelector('#video'),preview=document.querySelector('#preview'),pctx=preview.getContext('2d',{alpha:false}),hint=document.querySelector('#hint'),caption=document.querySelector('#caption'),status=document.querySelector('#status'),start=document.querySelector('#start'),sw=document.querySelector('#switch'),file=document.querySelector('#file'),sample=document.querySelector('#sample'),ctx=sample.getContext('2d');let watchdog=0,stream=null,face='environment',run=0,model=null,loading=null,timer=0,paintId=0,paintFrames=0,zoom=1,zoomCenterX=.5,zoomCenterY=.5;const badge=document.querySelector("#zoomBadge"),objects=document.querySelector('#objects'),octx=objects.getContext('2d'),speed=document.querySelector('#speed'),labels=document.querySelector('#labels');let torchOn=false,torchSupported=false;const flash=document.querySelector('#flash');let detecting=false,ocrBusy=false,detector=null;let history=[],lastCaption="",lastDetected=0,detailModel=null,detailLoading=null,analyzing=false;const say=s=>status.textContent=s,describe=s=>caption.textContent=s;function buttons(on){start.disabled=false;start.textContent=on?'Stop Camera':'Start Camera';start.classList.toggle('secondary',on);start.setAttribute('aria-pressed',String(on));sw.disabled=!on}function flashUI(){flash.textContent=torchOn?'⚡ Flash On':'⚡ Flash Off';flash.disabled=!stream||!torchSupported;flash.setAttribute('aria-pressed',String(torchOn));flash.title=torchSupported?'Toggle camera torch':'Torch unavailable on this camera/browser'}async function toggleFlash(){const track=stream?.getVideoTracks()[0];if(!track||!torchSupported){say('Flash unavailable for this camera or browser.');return}const next=!torchOn;try{await track.applyConstraints({advanced:[{torch:next}]});torchOn=next;flashUI();say('Flash '+(torchOn?'on':'off'))}catch(e){torchOn=false;flashUI();say('Flash could not be enabled: '+e.message)}}flash.onclick=toggleFlash;function cleanup(){torchOn=false;torchSupported=false;fla function sourceRect(){const w=v.videoWidth||640,h=v.videoHeight||480,sw=w/zoom,sh=h/zoom;return {x:Math.max(0,Math.min(w-sw,zoomCenterX*w-sw/2)),y:Math.max(0,Math.min(h-sh,zoomCenterY*h-sh/2)),w:sw,h:sh}}

async function script(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(Error('Failed to load '+src));document.head.append(s)})}async function getModel(){if(detector)return detector;if(!loading)loading=(async()=>{if(!window.tf)await script('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');if(!window.cocoSsd)await script('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');await tf.ready();detector=await cocoSsd.load({base:'lite_mobilenet_v2'});return detector})().catch(e=>{loading=null;throw e});return loading}

function drawDetections(found){octx.clearRect(0,0,objects.width,objects.height);if(!labels.checked)return;const scaleX=objects.width/sample.width,scaleY=objects.height/sample.height;octx.lineWidth=Math.max(2,objects.width/320);octx.font='bold '+Math.max(15,Math.round(objects.width/32))+'px -apple-system, sans-serif';for(const d of found){const [x,y,w,h]=d.bbox;const xx=x*scaleX,yy=y*scaleY,ww=w*scaleX,hh=h*scaleY;const label=d.class+' '+Math.round(d.score*100)+'%';octx.strokeStyle='#4af0b0';octx.strokeRect(xx,yy,ww,hh);const tw=octx.measureText(label).width+12;const ty=Math.max(0,yy-25);octx.fillStyle='rgba(5,25,30,.85)';octx.fillRect(xx,ty,tw,24);octx.fillStyle='#d7fff0';octx.fillText(label,xx+6,ty+17)}}

function sceneCaption(found){

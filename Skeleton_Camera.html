<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Camera Viewer</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7fc;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;margin:auto;padding:16px}h2{margin:4px 0 12px;font-size:22px}small{font-size:12px;color:#abc}.view{position:relative;background:#05080d;border:1px solid #4a5870;border-radius:14px;overflow:hidden;height:min(57vh,520px);min-height:260px}.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#05080d;pointer-events:none}.view #preview{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05080d}.view video{position:absolute!important;width:1px!important;height:1px!important;left:0!important;top:0!important;opacity:0.01!important;pointer-events:none!important;z-index:0}.view #preview{z-index:1;touch-action:none;user-select:none;-webkit-user-select:none}.zoomBadge{position:absolute;right:12px;top:12px;z-index:3;background:#0b1428bb;border:1px solid #64748b;border-radius:16px;padding:5px 10px;font-size:13px;font-weight:700;pointer-events:none}.hint{z-index:2}.hint{position:absolute;inset:0;display:grid;place-items:center;color:#b7c3d8;pointer-events:none}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{flex:1;min-width:120px;border:0;border-radius:10px;padding:13px;background:#367df0;color:white;font-weight:700;font-size:15px}button:disabled{opacity:.4}.secondary{background:#33445e}.box{background:#1b2b42;border:1px solid #3b4d67;border-radius:12px;padding:14px;margin-top:12px}.box strong{display:block;font-size:12px;color:#a9c4ec;margin-bottom:8px}.caption{font-size:19px;min-height:58px}#status{white-space:pre-wrap;overflow-wrap:anywhere;color:#c2d2e7;font-size:13px;line-height:1.5;margin-top:12px}#sample{display:none}</style></head><body><main><h2>AI Camera Viewer <small>v1.12</small></h2><div class="view"><video id="video" autoplay muted playsinline webkit-playsinline disablepictureinpicture></video><canvas id="preview"></canvas><div id="zoomBadge" class="zoomBadge">1.0×</div><div id="hint" class="hint">Tap Start Camera</div></div><div class="buttons"><button id="start">Start Camera</button><button id="switch" class="secondary" disabled>Switch Camera</button><button id="stop" class="secondary" disabled>Stop</button></div><div class="box"><strong>WHAT THE CAMERA SEES</strong><div class="caption" id="caption">Waiting for camera…</div></div><div id="status">Ready.</div><div class="buttons"><button id="photo" class="secondary">Take Photo Instead</button><input id="file" type="file" accept="image/*" capture="environment" hidden></div><canvas id="sample" width="224" height="224"></canvas></main><script>
(()=>{'use strict';const v=document.querySelector('#video'),preview=document.querySelector('#preview'),pctx=preview.getContext('2d',{alpha:false}),hint=document.querySelector('#hint'),caption=document.querySelector('#caption'),status=document.querySelector('#status'),start=document.querySelector('#start'),stop=document.querySelector('#stop'),sw=document.querySelector('#switch'),file=document.querySelector('#file'),sample=document.querySelector('#sample'),ctx=sample.getContext('2d');let stream=null,face='environment',run=0,model=null,loading=null,timer=0,paintId=0,paintFrames=0,zoom=1,zoomCenterX=.5,zoomCenterY=.5;const badge=document.querySelector("#zoomBadge");const say=s=>status.textContent=s,describe=s=>caption.textContent=s;function buttons(on){start.disabled=on;stop.disabled=!on;sw.disabled=!on}function cleanup(){run++;clearTimeout(timer);timer=0;cancelAnimationFrame(paintId);paintId=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.pause();v.srcObject=null;pctx.clearRect(0,0,preview.width,preview.height);hint.style.display='grid';buttons(false)}
function sourceRect(){const w=v.videoWidth||640,h=v.videoHeight||480,sw=w/zoom,sh=h/zoom;return {x:Math.max(0,Math.min(w-sw,zoomCenterX*w-sw/2)),y:Math.max(0,Math.min(h-sh,zoomCenterY*h-sh/2)),w:sw,h:sh}}
function setZoom(z){zoom=Math.max(1,Math.min(6,z));badge.textContent=zoom.toFixed(1)+'×'}
let touchesStart=null,lastTap=0;
preview.addEventListener('touchstart',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];touchesStart={distance:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),zoom};}else if(e.touches.length===1){const now=Date.now();if(now-lastTap<300){setZoom(1);zoomCenterX=.5;zoomCenterY=.5;}lastTap=now;}},{passive:false});
preview.addEventListener('touchmove',e=>{if(e.touches.length===2&&touchesStart){e.preventDefault();const a=e.touches[0],b=e.touches[1];setZoom(touchesStart.zoom*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/Math.max(1,touchesStart.distance));}},{passive:false});
preview.addEventListener('touchend',e=>{if(e.touches.length<2)touchesStart=null},{passive:true});
function paint(token){if(token!==run)return;if(v.readyState>=2&&v.videoWidth&&v.videoHeight){if(preview.width!==v.videoWidth||preview.height!==v.videoHeight){preview.width=v.videoWidth;preview.height=v.videoHeight}try{const r=sourceRect();pctx.drawImage(v,r.x,r.y,r.w,r.h,0,0,preview.width,preview.height);paintFrames++}catch(e){}}paintId=requestAnimationFrame(()=>paint(token))}
async function begin(){cleanup();const token=run;describe('Opening camera…');say('Requesting permission…');if(!navigator.mediaDevices?.getUserMedia){describe('Live camera unavailable in this viewer.');say('Camera API not available. Protocol: '+location.protocol+'; secure context: '+isSecureContext+'. Open from an HTTPS Safari page for reliable live camera access.');return}try{let s;try{s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:face},width:{ideal:640},height:{ideal:480}}})}catch(first){if(first.name==='OverconstrainedError'||first.name==='NotFoundError')s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});else throw first}if(token!==run){s.getTracks().forEach(t=>t.stop());return}stream=s;v.srcObject=s;v.muted=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.setAttribute('x-webkit-airplay','deny');v.disablePictureInPicture=true;v.controls=false;v.setAttribute('autoplay','');v.setAttribute('muted','');hint.style.display='none';buttons(true);paint(token);describe('Camera connected. Waiting for picture…');say('Camera track: '+s.getVideoTracks()[0]?.readyState+'; starting preview…');say('Passive autoplay test: no explicit video.play() call.');if(token!==run)return;describe('Camera live. Starting object recognition…');say('Camera connected. Preview frames: '+paintFrames+'; loading recognition…');timer=setTimeout(()=>classify(token),1200)}catch(err){if(token!==run)return;cleanup();describe('Camera could not start.');say('ERROR: '+err.name+' — '+err.message+'\nProtocol: '+location.protocol+'; secure: '+isSecureContext)}}
async function script(src){return new Promise((ok,bad)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>bad(Error('Failed to load '+src));document.head.append(s)})}async function getModel(){if(model)return model;if(!loading)loading=(async()=>{if(!window.tf)await script('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');if(!window.mobilenet)await script('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');await tf.ready();model=await mobilenet.load({version:2,alpha:0.5});return model})().catch(e=>{loading=null;throw e});return loading}
async function classify(token){try{const m=await getModel();if(token!==run)return;async function tick(){if(token!==run)return;try{if(v.readyState>=2&&v.videoWidth){const r=sourceRect();ctx.drawImage(v,r.x,r.y,r.w,r.h,0,0,224,224);const result=await m.classify(sample,3);if(token!==run)return;const top=result[0];if(top){const name=top.className.split(',')[0];describe(top.probability>.18?'Looks like: '+name+'.':'Not sure what I am seeing. Try another angle.');say('Camera frames: '+paintFrames+' • AI confidence '+Math.round(top.probability*100)+'%')}else describe('No recognizable object.')}else say('Camera active; waiting for frames.')}catch(e){say('AI processing issue: '+e.message)}if(token===run)timer=setTimeout(tick,2200)}tick()}catch(e){if(token===run){describe('Camera active; AI model unavailable.');say('AI load error: '+e.message+'\nCamera can continue without AI.')}}}
start.onclick=begin;stop.onclick=()=>{cleanup();describe('Camera stopped.');say('Stopped.')};sw.onclick=()=>{face=face==='environment'?'user':'environment';begin()};v.addEventListener('webkitbeginfullscreen',()=>{say('iOS opened its native player; attempting to return to inline camera.');try{v.webkitExitFullscreen?.()}catch(e){}});v.addEventListener('webkitendfullscreen',()=>{if(stream){say('Returned to inline camera; frames: '+paintFrames)}});preview.onclick=()=>{if(stream)say('Video state: '+(v.paused?'paused':'playing')+'; readyState '+v.readyState+'; frames '+paintFrames)};document.querySelector('#photo').onclick=()=>file.click();file.onchange=async()=>{const f=file.files?.[0];if(!f)return;describe('Analyzing photo…');try{const img=new Image();const url=URL.createObjectURL(f);await new Promise((ok,bad)=>{img.onload=ok;img.onerror=bad;img.src=url});ctx.drawImage(img,0,0,224,224);URL.revokeObjectURL(url);const m=await getModel();const r=await m.classify(sample,3);describe(r[0]?'Photo looks like: '+r[0].className.split(',')[0]: 'No match');say('Photo analysis complete')}catch(e){say('Photo error: '+e.message)}file.value=''};// Render camera frames on canvas; keep the video element non-interactive and offscreen-sized.
window.addEventListener('pagehide',cleanup);buttons(false)})();
</script></body></html>
